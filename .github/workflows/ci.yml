name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to catch breakage from new Elixir/OTP patch releases, which the
  # matrix picks up automatically.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Every supported Elixir/OTP pair, from Elixir's compatibility table:
      # 1.18 supports OTP 25-27, 1.19 supports 26-28, 1.20 supports 27-29.
      # This library requires Elixir 1.18+ and OTP 26+.
      matrix:
        include:
          - { elixir: "1.18", otp: "26" }
          - { elixir: "1.18", otp: "27" }
          - { elixir: "1.19", otp: "26" }
          - { elixir: "1.19", otp: "27" }
          - { elixir: "1.19", otp: "28" }
          - { elixir: "1.20", otp: "27" }
          - { elixir: "1.20", otp: "28" }
          - { elixir: "1.20", otp: "29" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test --cover --warnings-as-errors

  quality:
    name: Format, Credo, Dialyzer, audits, docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            priv/plts
          key: quality-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix hex.audit
      - run: mix deps.audit
      - run: mix dialyzer
      - run: MIX_ENV=dev mix docs --warnings-as-errors
      - run: MIX_ENV=dev mix hex.build
